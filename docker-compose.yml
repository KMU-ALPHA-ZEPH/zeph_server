services:
  app:
    build:
      context: .
    image: zeph-server:latest
    container_name: zeph-server
    env_file:
      - /etc/zeph-server/zeph.env
    expose:
      - "8080"
    restart: always

  caddy:
    image: caddy:2-alpine
    container_name: zeph-caddy
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: always

volumes:
  caddy_data:
  caddy_config:
