name: Deploy to EC2

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      APP_DIR: /opt/zeph_server
      APP_JAR: zeph-server.jar
      SERVICE_NAME: zeph-server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Build jar
        run: ./gradlew clean bootJar

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -p "${{ secrets.EC2_PORT || 22 }}" "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload jar to EC2
        run: |
          scp -i ~/.ssh/ec2_key \
            -P "${{ secrets.EC2_PORT || 22 }}" \
            build/libs/*.jar \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/${APP_JAR}"

      - name: Restart application
        run: |
          ssh -i ~/.ssh/ec2_key \
            -p "${{ secrets.EC2_PORT || 22 }}" \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << EOF
              set -e
              sudo mkdir -p "${APP_DIR}"
              sudo mv "/tmp/${APP_JAR}" "${APP_DIR}/${APP_JAR}"
              sudo systemctl restart "${SERVICE_NAME}"
              sudo systemctl status "${SERVICE_NAME}" --no-pager
          EOF
